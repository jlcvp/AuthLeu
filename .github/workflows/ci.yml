name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
# Cancel superseded runs of the same pull request, but let every run on main finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:ci
      - name: Build for Firebase Hosting
        run: npm run build
      - name: Build for GitHub Pages
        run: npm run build:githubpages
